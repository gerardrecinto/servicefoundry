name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "cases/rate-limiter/solution.py", "cases/feature-flag-service/solution.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py
          cp site/index.html _site/
          cp cases/rate-limiter/solution.py _site/py/rate_limiter.py
          cp cases/feature-flag-service/solution.py _site/py/feature_flags.py
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
